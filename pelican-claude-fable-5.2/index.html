<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f7fe0">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="title">鹈鹕骑自行车</div>
  <div class="stats"><span id="kmh">18</span> km/h · 已骑行 <span id="dist">0</span> m</div>
</div>

<div id="hint">单指拖动旋转 · 双指缩放 · 点一下画面让它跳</div>

<div id="panel">
  <div class="row">
    <button id="btnBell" type="button">🔔 铃铛</button>
    <button id="btnHop" type="button">🪽 跳跃</button>
    <button id="btnTime" type="button">☀️ 白天</button>
    <button id="btnCam" type="button" class="on">🎥 环绕</button>
  </div>
  <div class="row slider">
    <label for="speed">速度</label>
    <input id="speed" type="range" min="0" max="12" step="0.1" value="5">
  </div>
</div>

<div id="loading">加载中…</div>
<pre id="err"></pre>

<script>
  // 手机上没有控制台：把脚本错误直接显示在页面上
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += (e.message || '资源加载失败') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '') + '\n';
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += String(e.reason && e.reason.stack || e.reason) + '\n';
  });
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
