<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle — 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#9fd3ec;
    font-family:"PingFang SC","Helvetica Neue",system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  .overlay { position:fixed; left:24px; top:20px; color:#0b2a3a; z-index:10;
    text-shadow:0 1px 2px rgba(255,255,255,.5); pointer-events:none; }
  .overlay h1 { font-size:26px; font-weight:800; letter-spacing:-0.4px; }
  .overlay p { font-size:13.5px; margin-top:4px; opacity:.8; }
  .hint { position:fixed; right:18px; bottom:16px; color:#0b2a3a; font-size:12px;
    opacity:.65; z-index:10; }
  .badge { position:fixed; left:24px; bottom:16px; z-index:10; font-size:12px;
    color:#0b2a3a; opacity:.7; }
  #err { position:fixed; left:12px; bottom:40px; color:#7a0b0b; font:12px monospace;
    z-index:20; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay">
  <h1>🚲 Pelican Riding a Bicycle</h1>
  <p>The classic LLM frontend benchmark · 3D edition · drag to orbit</p>
</div>
<div class="hint">drag = 旋转 · 滚轮 = 缩放 · 右键 = 平移</div>
<div class="badge">Generated by Claude Opus 4.8 · Claude Code</div>
<div id="err"></div>

<script>
  window.__errs = [];
  function showErr(m){ window.__errs.push(m);
    var e=document.getElementById('err'); if(e) e.textContent = window.__errs.join('\n'); }
  addEventListener('error', e => showErr('ERR: ' + (e.message || e.filename) +
    (e.error && e.error.stack ? ('\n'+e.error.stack) : '')));
  addEventListener('unhandledrejection', e => showErr('REJ: ' +
    (e.reason && e.reason.message ? e.reason.message : e.reason)));
</script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script type="module" src="./app.js"></script>
</body>
</html>
